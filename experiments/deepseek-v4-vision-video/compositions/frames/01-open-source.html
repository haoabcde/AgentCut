  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const byId = (id) => document.getElementById(id);
      const PULSE = 0.5;
      const BEATS = [PULSE * 0.2, PULSE * 3, PULSE * 6, PULSE * 9, PULSE * 10];
      const api = byId("01-open-source-api");
      const cut = byId("01-open-source-cut");
      const vision = byId("01-open-source-vision");
      const agent = byId("01-open-source-agent");
      const wordSlot = byId("01-open-source-word-slot");
      const doorPath = byId("01-open-source-door-path");
      const finalGroup = byId("01-open-source-final");
      const openWord = byId("01-open-source-open");
      const sourceWord = byId("01-open-source-source");
      const lockRule = byId("01-open-source-lock-rule");
      const bloom = byId("01-open-source-bloom");
      const modelNode = byId("01-open-source-model-node");
      const nodePulse = byId("01-open-source-node-pulse");
      const repoTag = byId("01-open-source-repo-tag");
      const repoMap = byId("01-open-source-repo-map");
      const slices = Array.from(document.querySelectorAll("[data-slice]"));
      const repoPaths = [
        byId("01-open-source-path-a"),
        byId("01-open-source-path-b"),
        byId("01-open-source-path-c"),
      ];
      const glitchHash = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      tl.set([cut, vision, agent, finalGroup, bloom, modelNode, nodePulse, repoTag, repoMap], { opacity: 0 }, 0);
      tl.set(repoPaths, { strokeDasharray: 1, strokeDashoffset: 1, opacity: 0.42 }, 0);
      tl.set(doorPath, { strokeDasharray: 1, strokeDashoffset: 1, opacity: 0 }, 0);
      tl.set(lockRule, { scaleX: 0 }, 0);

      slices.forEach((slice, index) => {
        const bandHeight = 100 / slices.length;
        tl.set(
          slice,
          {
            clipPath: `inset(${index * bandHeight}% 0 ${100 - (index + 1) * bandHeight}% 0)`,
            opacity: 0,
          },
          0,
        );
      });

      tl.fromTo(
        api,
        { y: -470, scale: 1.12, filter: "blur(12px)", opacity: 0 },
        { y: 0, scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
        BEATS[0],
      );

      tl.fromTo(
        cut,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.18, ease: "expo.out" },
        BEATS[1],
      );
      tl.set(api, { opacity: 0 }, BEATS[1] + 0.02);
      slices.forEach((slice, index) => {
        const direction = glitchHash(index * 3 + 1) > 0.5 ? 1 : -1;
        const offset = direction * (18 + glitchHash(index * 5 + 2) * 42);
        tl.fromTo(
          slice,
          { x: offset, scaleX: 1 + glitchHash(index * 7 + 3) * 0.26, opacity: 1 },
          { x: 0, scaleX: 1, opacity: 1, duration: 0.28, ease: "steps(4)" },
          BEATS[1] + glitchHash(index * 11 + 4) * 0.055,
        );
      });
      tl.set(slices, { x: 0, scaleX: 1, opacity: 0 }, BEATS[1] + 0.34);
      tl.set(vision, { opacity: 1 }, BEATS[1] + 0.34);
      tl.fromTo(
        repoMap,
        { opacity: 0 },
        { opacity: 1, duration: 0.34, ease: "power2.out" },
        BEATS[1] + 0.28,
      );

      repoPaths.forEach((path, index) => {
        tl.fromTo(
          path,
          { strokeDashoffset: 1, opacity: 0.18 },
          { strokeDashoffset: 0, opacity: 0.55, duration: 0.8, ease: "power2.out" },
          BEATS[1] + 0.38 + index * PULSE * 0.72,
        );
      });

      tl.set(vision, { opacity: 0 }, BEATS[2]);
      tl.set(agent, { opacity: 1 }, BEATS[2]);
      tl.fromTo(
        cut,
        { scaleX: 1, opacity: 1 },
        { scaleX: 0.82, y: -300, opacity: 0.72, duration: 0.32, ease: "power4.inOut" },
        BEATS[3] - 0.28,
      );
      tl.to(wordSlot, { x: -230, opacity: 0, duration: 0.3, ease: "power4.in" }, BEATS[3] - 0.3);

      tl.fromTo(
        doorPath,
        { strokeDashoffset: 1, opacity: 0.15 },
        { strokeDashoffset: 0, opacity: 1, duration: 0.72, ease: "power4.out" },
        BEATS[3],
      );
      tl.fromTo(
        finalGroup,
        { x: 230, opacity: 0.35 },
        { x: 0, opacity: 1, duration: 0.42, ease: "power4.out" },
        BEATS[3],
      );
      tl.fromTo(
        openWord,
        { x: -210, filter: "blur(10px)", opacity: 0 },
        { x: 0, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "expo.out" },
        BEATS[3] + 0.08,
      );
      tl.fromTo(
        sourceWord,
        { y: 90, rotation: 6, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "circ.out" },
        BEATS[4],
      );
      tl.to(lockRule, { scaleX: 1, duration: 0.48, ease: "power3.out" }, BEATS[4] + 0.26);

      tl.fromTo(
        bloom,
        { opacity: 0, scale: 0.8 },
        { opacity: 0.28, scale: 1.06, duration: 0.45, ease: "power2.out" },
        BEATS[4] + 0.18,
      );
      tl.to(bloom, { opacity: 0.12, scale: 1, duration: 0.42, ease: "power2.out" }, BEATS[4] + 0.63);
      tl.fromTo(
        modelNode,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.48, ease: "back.out(2)" },
        BEATS[4] + 0.28,
      );
      tl.fromTo(
        nodePulse,
        { scale: 0.4, opacity: 0.72 },
        { scale: 1.85, opacity: 0, duration: 0.86, ease: "power2.out" },
        BEATS[4] + 0.35,
      );
      tl.fromTo(
        repoTag,
        { y: 28, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "circ.out" },
        BEATS[4] + 0.62,
      );

      window.__timelines["01-open-source"] = tl;
    })();
